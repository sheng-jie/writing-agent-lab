
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自媒体写作工作台 UI 原型｜可收缩流程栏</title>
  <style>
    :root {
      --bg: oklch(98% 0.006 185);
      --surface: oklch(100% 0 0);
      --surface-soft: oklch(96.5% 0.012 180);
      --fg: oklch(19% 0.025 210);
      --muted: oklch(48% 0.022 220);
      --border: oklch(89% 0.011 190);
      --border-strong: oklch(80% 0.018 190);
      --accent: oklch(52% 0.115 166);
      --accent-strong: oklch(42% 0.12 166);
      --accent-soft: oklch(92% 0.045 166);
      --assistant: oklch(24% 0.035 245);
      --assistant-soft: oklch(95% 0.015 245);
      --success: oklch(56% 0.14 152);
      --warning: oklch(68% 0.13 72);
      --gold: oklch(74% 0.13 78);
      --shadow: 0 18px 44px color-mix(in oklch, var(--fg) 10%, transparent);
      --shadow-soft: 0 8px 22px color-mix(in oklch, var(--fg) 7%, transparent);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --space-xs: 6px;
      --space-sm: 10px;
      --space-md: 14px;
      --space-lg: 18px;
      --space-xl: 24px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --font-display: "Söhne", "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--fg);
      font-family: var(--font-body);
      background:
        radial-gradient(circle at 8% 0%, color-mix(in oklch, var(--accent) 10%, transparent), transparent 26rem),
        radial-gradient(circle at 92% 0%, color-mix(in oklch, var(--gold) 8%, transparent), transparent 30rem),
        var(--bg);
      font-size: 16px;
      text-rendering: optimizeLegibility;
    }

    body { overflow: hidden; }

    button,
    input,
    textarea { font: inherit; }

    input::placeholder,
    textarea::placeholder {
      color: color-mix(in oklch, var(--muted) 88%, var(--fg));
      opacity: 1;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    :focus-visible {
      outline: 3px solid color-mix(in oklch, var(--accent) 48%, transparent);
      outline-offset: 3px;
    }

    .app-shell {
      height: 100vh;
      padding: var(--space-lg);
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      gap: var(--space-lg);
      transition: grid-template-columns 240ms var(--ease-out);
    }

    .app-shell.rail-collapsed {
      grid-template-columns: 78px minmax(0, 1fr);
    }

    .flow-rail {
      min-width: 0;
      background: color-mix(in oklch, var(--surface) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
      position: relative;
      transition: border-radius 220ms ease;
    }

    .brand-block {
      padding: 20px var(--space-lg) 15px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-lockup {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background:
        linear-gradient(135deg, var(--fg), color-mix(in oklch, var(--accent) 62%, var(--fg))),
        var(--fg);
      position: relative;
      box-shadow: inset 0 0 0 1px color-mix(in oklch, white 18%, transparent);
    }

    .logo-mark::before,
    .logo-mark::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 999px;
      opacity: 0.92;
      left: 11px;
      height: 3px;
    }

    .logo-mark::before {
      width: 18px;
      top: 13px;
    }

    .logo-mark::after {
      width: 12px;
      top: 22px;
    }

    .brand-text {
      min-width: 0;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .brand-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 17px;
      letter-spacing: -0.02em;
      line-height: 1.1;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .rail-toggle {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--fg);
      background: var(--surface-soft);
      border: 1px solid var(--border);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .rail-toggle:hover {
      transform: translateY(-1px);
      background: white;
      border-color: var(--border-strong);
    }

    .rail-toggle svg {
      width: 17px;
      height: 17px;
      transition: transform 220ms ease;
    }

    .project-card {
      margin: 16px 18px 0;
      padding: var(--space-md);
      border-radius: 16px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .project-card small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 8px;
    }

    .progress-line {
      height: 8px;
      border-radius: 999px;
      background: color-mix(in oklch, var(--border) 64%, white);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      border-radius: inherit;
      background: var(--accent-strong);
      transform: scaleX(var(--progress-scale, 0.125));
      transform-origin: left center;
      transition: transform 280ms var(--ease-out);
    }

    .progress-meta {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .flow-list {
      min-height: 0;
      overflow: auto;
      padding: 16px 14px 18px;
    }

    .flow-step {
      width: 100%;
      text-align: left;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 10px;
      border-radius: 16px;
      background: transparent;
      color: var(--fg);
      position: relative;
      transition: background 160ms ease, transform 160ms ease;
    }

    .flow-step:hover {
      background: color-mix(in oklch, var(--accent-soft) 45%, transparent);
    }

    .flow-step + .flow-step { margin-top: 4px; }

    .flow-step::before {
      content: "";
      position: absolute;
      left: 27px;
      top: -7px;
      width: 1px;
      height: 14px;
      background: var(--border-strong);
    }

    .flow-step:first-child::before { display: none; }

    .step-index {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease;
    }

    .step-icon {
      display: none;
      font-weight: 760;
      font-size: 14px;
      letter-spacing: -0.04em;
    }

    .step-number {
      display: inline;
    }

    .step-copy {
      min-width: 0;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .step-title {
      display: block;
      font-weight: 720;
      letter-spacing: -0.01em;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .step-desc {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .step-output {
      display: block;
      margin-top: 5px;
      color: color-mix(in oklch, var(--fg) 72%, var(--muted));
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .step-state {
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 4px 7px;
      border-radius: 999px;
      white-space: nowrap;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .flow-step.is-active {
      background: var(--accent-soft);
    }

    .flow-step.is-active .step-output {
      color: var(--accent-strong);
    }

    .flow-step.is-active .step-index {
      background: var(--accent);
      color: white;
      border-color: transparent;
    }

    .flow-step.is-complete .step-index {
      color: white;
      background: var(--fg);
      border-color: var(--fg);
    }

    .rail-footer {
      padding: 16px var(--space-lg) 20px;
      border-top: 1px solid var(--border);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .health-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .health-row + .health-row { margin-top: 10px; }

    .health-score {
      color: var(--fg);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .app-shell.rail-collapsed .flow-rail {
      grid-template-rows: auto minmax(0, 1fr);
    }

    .app-shell.rail-collapsed .brand-block {
      padding: 18px 10px 14px;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .app-shell.rail-collapsed .brand-lockup {
      justify-content: center;
    }

    .app-shell.rail-collapsed .brand-text,
    .app-shell.rail-collapsed .project-card,
    .app-shell.rail-collapsed .rail-footer {
      opacity: 0;
      transform: translateX(-8px);
      pointer-events: none;
      position: absolute;
      visibility: hidden;
    }

    .app-shell.rail-collapsed .rail-toggle svg {
      transform: rotate(180deg);
    }

    .app-shell.rail-collapsed .flow-list {
      padding: 12px 10px 16px;
      overflow: visible auto;
    }

    .app-shell.rail-collapsed .flow-step {
      grid-template-columns: 36px;
      justify-content: center;
      padding: 10px;
      gap: 0;
    }

    .app-shell.rail-collapsed .flow-step::before {
      left: 50%;
      transform: translateX(-50%);
    }

    .app-shell.rail-collapsed .step-copy,
    .app-shell.rail-collapsed .step-state {
      opacity: 0;
      transform: translateX(-6px);
      pointer-events: none;
      position: absolute;
      visibility: hidden;
    }

    .app-shell.rail-collapsed .step-number {
      display: none;
    }

    .app-shell.rail-collapsed .step-icon {
      display: inline;
    }

    .app-shell.rail-collapsed .flow-step::after {
      content: attr(data-title);
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%) translateX(-6px);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      z-index: 30;
      padding: 8px 10px;
      border-radius: 10px;
      background: color-mix(in oklch, var(--fg) 92%, black);
      color: white;
      font-size: 12px;
      box-shadow: var(--shadow-soft);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .app-shell.rail-collapsed .flow-step:hover::after,
    .app-shell.rail-collapsed .flow-step:focus-visible::after {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }

    .workbench {
      min-width: 0;
      background: color-mix(in oklch, var(--surface) 88%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .topbar {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(180deg, color-mix(in oklch, white 72%, transparent), transparent),
        color-mix(in oklch, var(--surface) 82%, transparent);
    }

    .article-kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .step-summary {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      max-width: 78ch;
      text-wrap: pretty;
    }

    .step-summary strong {
      color: var(--accent-strong);
      font-weight: 760;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--success);
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--success) 16%, transparent);
    }

    .article-title-input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--fg);
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 760;
      letter-spacing: -0.035em;
      line-height: 1.08;
      padding: 0;
      min-height: 3.8rem;
      resize: none;
      overflow: hidden;
      text-wrap: balance;
    }

    .topbar-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 12px;
      white-space: nowrap;
    }

    .pill strong {
      color: var(--fg);
      font-weight: 720;
    }

    .main-area {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(500px, 1fr) minmax(320px, 380px);
      gap: 0;
    }

    .step-workspace {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 22px;
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(300px, 0.88fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .panel-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .panel-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .panel-caption {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .panel-body { padding: 18px; }

    .field-stack {
      display: grid;
      gap: 12px;
    }

    .field-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .text-input,
    .text-area {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--fg);
      border-radius: 12px;
      outline: none;
      transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .text-input {
      height: 42px;
      padding: 0 12px;
    }

    .text-area {
      min-height: 126px;
      resize: vertical;
      padding: 12px;
      line-height: 1.58;
    }

    .text-input:focus,
    .text-area:focus {
      border-color: color-mix(in oklch, var(--accent) 52%, var(--border));
      background: white;
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 12%, transparent);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
    }

    .chip.is-active {
      border-color: color-mix(in oklch, var(--accent) 45%, var(--border));
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .note-list {
      display: grid;
      gap: 10px;
    }

    .note-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      background: var(--surface-soft);
    }

    .note-card strong {
      display: block;
      font-size: 13px;
      letter-spacing: -0.01em;
      margin-bottom: 5px;
    }

    .note-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .metric {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-soft);
      min-height: 94px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 8px;
    }

    .metric strong {
      display: block;
      font-family: var(--font-mono);
      font-size: 18px;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .outline-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .outline-item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      border-radius: 14px;
    }

    .outline-number {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--fg);
      color: white;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .outline-item b {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .outline-item span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .editor-surface {
      min-height: 430px;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      background:
        linear-gradient(var(--surface) 31px, transparent 32px),
        linear-gradient(90deg, color-mix(in oklch, var(--border) 42%, transparent) 1px, transparent 1px),
        white;
      background-size: 100% 32px, 32px 32px;
      line-height: 32px;
      outline: none;
      font-size: 1rem;
      text-wrap: pretty;
    }

    .readiness-panel {
      display: grid;
      gap: 10px;
    }

    .readiness-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .readiness-row:last-child { border-bottom: 0; }

    .readiness-dot {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid color-mix(in oklch, var(--accent) 34%, var(--border));
    }

    .readiness-row.is-missing .readiness-dot {
      background: color-mix(in oklch, var(--warning) 18%, white);
      border-color: color-mix(in oklch, var(--warning) 42%, var(--border));
    }

    .readiness-row b {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .readiness-row span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .check-list {
      display: grid;
      gap: 10px;
    }

    .check-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-soft);
    }

    .check-box {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: white;
    }

    .check-row.is-done .check-box {
      background: var(--success);
      border-color: var(--success);
      box-shadow: inset 0 0 0 4px white;
    }

    .check-row span { font-size: 13px; }

    .check-row em {
      font-style: normal;
      color: var(--muted);
      font-size: 11px;
    }

    .tone-board,
    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .tone-card {
      padding: 13px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
    }

    .tone-card b {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .tone-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .image-placeholder {
      aspect-ratio: 16 / 10;
      border: 1px solid var(--border);
      border-radius: 18px;
      background:
        linear-gradient(135deg, color-mix(in oklch, var(--accent) 16%, white), color-mix(in oklch, var(--gold) 14%, white)),
        var(--surface-soft);

    function renderFlow() {
      flowList.innerHTML = steps.map((step, index) => {
        const state = index < currentStep ? "已完成" : index === currentStep ? "进行中" : "待处理";
        const className = [
          "flow-step",
          index === currentStep ? "is-active" : "",
          index < currentStep ? "is-complete" : ""
        ].join(" ");
        return `
          <button class="${className}" type="button" data-step="${index}" data-title="${step.title}" aria-current="${index === currentStep ? "step" : "false"}" aria-label="${step.title}，${state}">
            <span class="step-index">
              <span class="step-number">${index < currentStep ? "✓" : String(index + 1).padStart(2, "0")}</span>
              <span class="step-icon">${step.icon}</span>
            </span>
            <span class="step-copy">
              <span class="step-title">${step.title}</span>
              <span class="step-desc">${step.desc}</span>
              <span class="step-output">${step.outcome}</span>
            </span>
            <span class="step-state">${state}</span>
          </button>
        `;
      }).join("");

      flowList.querySelectorAll("[data-step]").forEach(button => {
        button.addEventListener("click", () => {
          currentStep = Number(button.dataset.step);
          renderAll();

          const card = document.createElement("article");
          card.className = "note-card";
          card.innerHTML = `<strong>新捕捉的灵感</strong><p>${escapeHtml(input.value || "待补充灵感内容")}</p>`;
          cards.prepend(card);
          showToast("已加入素材卡片");
        });
      }

      const regenerateOutlineButton = stepWorkspace.querySelector("[data-regenerate-outline]");
      if (regenerateOutlineButton) {
        regenerateOutlineButton.addEventListener("click", () => showToast("已基于当前选题刷新大纲建议"));
      }

      const imageBriefButton = stepWorkspace.querySelector("[data-image-brief]");
      if (imageBriefButton) {
        imageBriefButton.addEventListener("click", () => showToast("已生成 4 条配图提示词"));
      }
    }

    function renderAssistant() {
      const step = steps[currentStep];
      assistantSubtitle.textContent = step.assistantSubtitle;
      assistantFeed.innerHTML = step.assistant.map(item => {
        const primaryClass = item.type === "primary" ? " is-primary" : "";
        const content = item.list
          ? `<ul>${item.list.map(text => `<li>${text}</li>`).join("")}</ul>`
          : `<p>${item.body}</p>`;
        const actions = item.actions
          ? `<div class="suggestion-actions">${item.actions.map(text => `<button class="btn" type="button" data-suggestion="${escapeHtml(text)}">${text}</button>`).join("")}</div>`
          : "";
        return `
          <article class="assistant-card${primaryClass}">
            <b>${item.title}</b>
            ${content}
            ${actions}
          </article>
        `;
      }).join("");

      assistantFeed.querySelectorAll("[data-suggestion]").forEach(button => {
        button.addEventListener("click", () => {
          showToast(`已采用：${button.dataset.suggestion}`);
        });
      });
    }

    function renderMeta() {
      const step = steps[currentStep];
      currentStepName.textContent = step.title;
      currentStepSummary.innerHTML = `<strong>当前任务</strong><span>${step.missing}</span>`;
      wordTarget.textContent = step.wordTarget;
      actionTitle.textContent = step.title;
      actionHint.textContent = step.hint;
      structureScore.textContent = step.structure;
      naturalScore.textContent = step.natural;
      publishScore.textContent = step.publish;

      const percent = Math.round(((currentStep + 1) / steps.length) * 100);
      progressFill.style.setProperty("--progress-scale", String(percent / 100));
      progressText.textContent = `${currentStep + 1} / ${steps.length} 步`;
      progressPercent.textContent = percent + "%";

      prevBtn.disabled = currentStep === 0;
      nextBtn.disabled = false;
      nextBtn.textContent = step.primaryAction;
    }

    function renderAll() {
      renderFlow();
      renderWorkspace();
      renderAssistant();
      renderMeta();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    railToggle.addEventListener("click", () => {
      const collapsed = !appShell.classList.contains("rail-collapsed");
      setRailCollapsed(collapsed);
      showToast(collapsed ? "流程栏已收起，右侧工作区已扩大" : "流程栏已展开");
    });

    prevBtn.addEventListener("click", () => {
      if (currentStep > 0) {
        currentStep -= 1;
        renderAll();
      }
    });

    nextBtn.addEventListener("click", () => {
      const step = steps[currentStep];
      nextBtn.classList.add("is-loading");
      nextBtn.disabled = true;
      nextBtn.textContent = step.primaryAction;

      window.setTimeout(() => {
        nextBtn.classList.remove("is-loading");
        if (currentStep < steps.length - 1) {
          showToast(`${step.title}已保存，进入下一步`);
          currentStep += 1;
          renderAll();
        } else {
          showToast("发布检查已打开，可以复制发布清单");
          renderMeta();
        }
      }, 520);
    });

    saveBtn.addEventListener("click", () => {
      autosaveState.textContent = "已手动保存 · 刚刚";
      showToast("草稿已保存");
    });

    copyBtn.addEventListener("click", async () => {
      const step = steps[currentStep];
      const title = articleTitle.value;
      const text = `《${title}》\n当前步骤：${step.title}\n阶段目标：${step.hint}`;
      try {
        await navigator.clipboard.writeText(text);
        showToast("阶段内容已复制");
      } catch (error) {
        showToast("已准备好复制内容");
      }
    });

    assistantForm.addEventListener("submit", event => {
      event.preventDefault();
      const prompt = assistantPrompt.value.trim();
      const step = steps[currentStep];
      const card = document.createElement("article");
      card.className = "assistant-card is-primary";
      card.innerHTML = `
        <b>基于补充背景的新建议</b>
        <p>${prompt ? escapeHtml(prompt) + "。建议在“" + step.title + "”阶段补充一个更具体的读者场景，并把输出物控制在一个可执行动作内。" : "请先补充一点背景，我会把它转成当前步骤的可执行建议。"}</p>
      `;
      assistantFeed.prepend(card);
      assistantPrompt.value = "";
      showToast("AI 建议已生成");
    });

    clearPromptBtn.addEventListener("click", () => {
      assistantPrompt.value = "";
      assistantPrompt.focus();
    });

    articleTitle.addEventListener("input", () => {
      resizeTitleInput();
      autosaveState.textContent = "正在保存标题…";
      window.clearTimeout(articleTitle.saveTimer);
      articleTitle.saveTimer = window.setTimeout(() => {
        autosaveState.textContent = "已自动保存 · 刚刚";
      }, 700);
    });

    restoreRailState();
    resizeTitleInput();
    renderAll();
  </script>
</body>
</html>
